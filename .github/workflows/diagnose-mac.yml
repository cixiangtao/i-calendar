name: 检查 WKWebView 背景色刷新

on:
  push:
    branches: ['ci/diagnose-v2.1.0']

permissions:
  contents: read

jobs:
  probe:
    name: 隐藏 WKWebView 背景色
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 用系统 WKWebView 执行最小复现
        run: |
          sw_vers
          swift scripts/theme-webview-probe.swift
