name: 更新官网

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'apps/calendar/index.html'
      - 'apps/calendar/src/Website.tsx'
      - 'apps/calendar/src/website.css'
      - 'apps/calendar/src/AmbientOrbit.tsx'
      - 'docs/images/theme-mountain.webp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 检查与构建官网
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 准备锁定工具链
        run: |
          npm install --global corepack@0.35.0 --force
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: 写入官网提交号
        run: printf '%s\n' "$GITHUB_SHA" > apps/calendar/dist/site-revision.txt
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/calendar/dist

  website:
    name: 部署官网
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: i-calendar-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署已检查的官网产物
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
